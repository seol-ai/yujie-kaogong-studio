<style>
/* ===== 韩系甜美ins风 设计系统 ===== */
:root{
  --sky1:#E8F4FD;--sky2:#D6EBFA;--pink1:#FFE8EE;--pink2:#FFD4E5;--purple1:#F3E8FF;--purple2:#E6D0FF;
  --yellow1:#FFF8E1;--mint1:#E8F8EF;--mint2:#D4F5E3;--lav:#C9A7EB;--lav-d:#B589DB;
  --ink:#4A3B52;--muted:#9B8CAB;--border:#EDE4F5;--card:rgba(255,255,255,.88);--card-solid:#fff;
  --radius:18px;--shadow:0 4px 24px rgba(180,140,220,.08);--shadow-lg:0 8px 40px rgba(180,140,220,.12);
  --font:"PingFang SC","Microsoft YaHei UI","Noto Sans SC",sans-serif;
  --sidebar-w:250px;
}
[data-theme="mint"]{--lav:#7ECCB5;--lav-d:#5FB89E;--purple1:#E8F8EF;--purple2:#D4F5E3;--pink1:#E8F8EF;--pink2:#D4F5E3;}
[data-theme="sky"]{--lav:#8AC6E8;--lav-d:#6AB5DA;--purple1:#E8F4FD;--purple2:#D6EBFA;--pink1:#E8F4FD;--pink2:#D6EBFA;}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--font);color:var(--ink);line-height:1.7;background:linear-gradient(180deg,var(--sky1) 0%,var(--purple1) 40%,var(--pink1) 100%);min-height:100vh;overflow-x:hidden}
::selection{background:var(--purple2);color:var(--ink)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--lav);border-radius:10px}
input,textarea,select,button{font-family:inherit;font-size:14px}
a{color:var(--lav-d);text-decoration:none}

/* 布局 */
.app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--card);backdrop-filter:blur(12px);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:100;transition:transform .3s ease}
.sidebar-brand{padding:20px 18px 12px;text-align:center}
.sidebar-brand .logo{font-size:22px;font-weight:700;color:var(--lav-d)}
.sidebar-brand .sub{font-size:11px;color:var(--muted);margin-top:2px}
.nav{flex:1;overflow-y:auto;padding:8px 12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;cursor:pointer;color:var(--ink);transition:all .2s;margin-bottom:4px;font-size:14px}
.nav-item:hover{background:var(--purple1)}
.nav-item.active{background:linear-gradient(135deg,var(--lav),var(--lav-d));color:#fff;box-shadow:0 3px 12px rgba(201,167,235,.35)}
.nav-item .ico{font-size:18px;width:24px;text-align:center}
.nav-item .badge{margin-left:auto;background:var(--pink2);color:#C75B7A;font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700}
.nav-item.active .badge{background:rgba(255,255,255,.3);color:#fff}
.sidebar-footer{padding:12px;text-align:center;font-size:11px;color:var(--muted)}

.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:var(--card);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.hamburger{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--lav-d);padding:4px 8px}
.topbar-date{font-size:13px;color:var(--muted)}
.topbar-d{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--purple1);padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--lav-d)}
.topbar-d.warm{background:#FFE0E0;color:#D04040}
.content{flex:1;padding:20px;max-width:1400px;width:100%;margin:0 auto}

/* 移动遮罩 */
.overlay{display:none;position:fixed;inset:0;background:rgba(74,59,82,.3);z-index:99;backdrop-filter:blur(2px)}
.overlay.show{display:block}

/* 卡片 */
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
.card h2{font-size:17px;font-weight:700;color:var(--lav-d);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card h2 .ico{font-size:20px}
.card h3{font-size:15px;font-weight:600;color:var(--ink);margin:14px 0 8px}
.card .desc{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--card-solid);border:1px solid var(--border);border-radius:16px;padding:16px;text-align:center}
.stat .num{font-size:28px;font-weight:700;color:var(--lav-d)}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:2px}

/* 表单 */
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:9px 13px;border:1.5px solid var(--border);border-radius:12px;font-size:14px;background:#FDFAFF;color:var(--ink);transition:border .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--lav)}
textarea{resize:vertical;min-height:64px;line-height:1.6}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.btn{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,var(--lav),var(--lav-d));color:#fff;border:none;padding:9px 20px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;box-shadow:0 3px 10px rgba(201,167,235,.3)}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(201,167,235,.4)}
.btn:active{transform:translateY(0)}
.btn-sm{padding:5px 13px;font-size:12px;border-radius:10px}
.btn-out{background:var(--card-solid);color:var(--lav-d);border:1.5px solid var(--lav)}
.btn-out:hover{background:var(--purple1)}
.btn-pink{background:linear-gradient(135deg,#FF8FAB,#E6729A)}
.btn-gray{background:#D5CEDD;color:#6B5B7B}
.btn-danger{background:#FF8A9A;color:#fff}
.btn-danger:hover{background:#E67282}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.toolbar input,.toolbar select{flex:1;min-width:120px;width:auto}
.empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px}
.empty .emoji{font-size:40px;display:block;margin-bottom:8px}

/* 条目 */
.entry{background:#FDFAFF;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;transition:box-shadow .2s}
.entry:hover{box-shadow:var(--shadow)}
.entry .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.entry .tag{background:var(--purple1);color:var(--lav-d);padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600}
.entry .tag.red{background:#FFE0E0;color:#D04040}
.entry .tag.blue{background:var(--sky1);color:#3A8DBE}
.entry .tag.green{background:var(--mint1);color:#2E9E7A}
.entry .tag.yellow{background:var(--yellow1);color:#B89020}
.entry .tag.pink{background:var(--pink1);color:#C75B7A}
.entry .date{font-size:11px;color:var(--muted)}
.entry .body{font-size:13px;color:var(--ink);line-height:1.7}
.entry .actions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.entry .star{color:var(--yellow1);background:none;border:none;cursor:pointer;font-size:16px}
.entry .fav{color:var(--pink2);background:none;border:none;cursor:pointer;font-size:16px}
.entry .fav.on{color:#E6729A}
.entry .red-mark{background:none;border:none;cursor:pointer;font-size:16px;color:var(--muted)}
.entry .red-mark.on{color:#FF6B7A}
.entry .edit,.entry .del{background:var(--card-solid);border:1px solid var(--border);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.entry .edit:hover{color:var(--lav-d);border-color:var(--lav)}
.entry .del:hover{color:#D04040;border-color:#FF8A9A}
.entry.highlight{border-left:4px solid var(--yellow1)}
.entry.red-note{border-left:4px solid #FF8A9A}
mark.red{background:#FFD4D4;color:#C04040;padding:0 3px;border-radius:3px}
mark.hl{background:var(--yellow1);color:var(--ink);padding:0 3px;border-radius:3px}

/* 进度条 */
.progress{height:10px;background:var(--purple1);border-radius:10px;overflow:hidden;position:relative;margin:6px 0}
.progress .bar{height:100%;background:linear-gradient(90deg,var(--lav),var(--lav-d));border-radius:10px;transition:width .5s}
.progress .goal{position:absolute;top:0;bottom:0;width:2px;background:#FF8FAB;opacity:.8}
.progress-label{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:2px}

/* 掌握度圆点 */
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.dot.unlearned{background:#D5CEDD}
.dot.weak{background:#FF8A9A}
.dot.mastered{background:#F5C88B}
.dot.proficient{background:#7ECCB5}
.mastery-tag{font-size:11px;padding:1px 8px;border-radius:8px;font-weight:600}
.mastery-tag.unlearned{background:#EDE4F5;color:#9B8CAB}
.mastery-tag.weak{background:#FFE0E0;color:#D04040}
.mastery-tag.mastered{background:var(--yellow1);color:#B89020}
.mastery-tag.proficient{background:var(--mint1);color:#2E9E7A}

/* 日历 */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:340px;margin:0 auto}
.cal .dow{text-align:center;font-size:11px;color:var(--muted);padding:4px 0}
.cal .day{text-align:center;padding:8px 0;border-radius:10px;font-size:13px;cursor:pointer;transition:all .2s;min-height:36px}
.cal .day:hover{background:var(--purple1)}
.cal .day.checked{background:var(--pink1);color:#C75B7A;font-weight:700;border:2px solid var(--pink2)}
.cal .day.today{box-shadow:0 0 0 2px var(--lav) inset}
.cal .day.other{opacity:.3}

/* 对话 */
.chat-tabs{display:flex;gap:8px;margin-bottom:12px}
.chat-tab{flex:1;text-align:center;padding:10px;border-radius:12px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;background:var(--card-solid);border:1.5px solid var(--border);color:var(--muted)}
.chat-tab.active{background:linear-gradient(135deg,var(--lav),var(--lav-d));color:#fff;border-color:var(--lav)}
.chat-wrap{display:grid;grid-template-columns:1fr 200px;gap:14px}
.chat-main{min-height:300px}
.chat-box{height:360px;overflow-y:auto;border:1px solid var(--border);border-radius:14px;padding:14px;background:#FDFAFF}
.msg{margin-bottom:12px;max-width:85%}
.msg.user{margin-left:auto;text-align:right}
.msg .bubble{display:inline-block;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.7;text-align:left;white-space:pre-wrap;word-break:break-word}
.msg.teacher .bubble{background:var(--purple1);color:var(--ink);border-bottom-left-radius:4px}
.msg.user .bubble{background:linear-gradient(135deg,var(--lav),var(--lav-d));color:#fff;border-bottom-right-radius:4px}
.chat-input{display:flex;gap:8px;margin-top:10px}
.chat-input textarea{flex:1;min-height:44px;max-height:120px}
.chat-history-list{max-height:360px;overflow-y:auto}
.chat-history-list .h-item{padding:8px 10px;border-radius:10px;cursor:pointer;font-size:12px;color:var(--muted);transition:.2s;margin-bottom:4px}
.chat-history-list .h-item:hover{background:var(--purple1)}
.chat-history-list .h-item.active{background:var(--purple1);color:var(--lav-d);font-weight:600}
.kb-card{background:var(--card-solid);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.kb-card summary{cursor:pointer;font-weight:600;color:var(--lav-d);font-size:13px}
.kb-card .content-kb{margin-top:8px;font-size:12px;color:var(--ink);line-height:1.8;white-space:pre-wrap}

/* 错题 */
.错因-btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;border:2px solid;transition:all .2s;margin:4px}
.错因-btn.concept{border-color:#FF8A9A;color:#D04040;background:#fff}
.错因-btn.concept.on{background:#FFE0E0}
.错因-btn.logic{border-color:#8AC6E8;color:#3A8DBE;background:#fff}
.错因-btn.logic.on{background:var(--sky1)}
.错因-btn.careless{border-color:#D5CEDD;color:#6B5B7B;background:#fff}
.错因-btn.careless.on{background:#EDE4F5}
.错因-hint{font-size:12px;color:var(--muted);margin-top:4px;padding:8px 12px;border-radius:10px;background:var(--yellow1)}

function genGenericQ(kp){

    {q:`【${kp}】该知识点最常见的考查方式是？`,opts:["直接定义判断","结合材料分析","公式计算应用","以上都可能"],a:3,exp:`${kp}的考查方式多样，需要全面掌握。定义判断、材料分析、计算应用都可能出现。`},
    {q:`【${kp}】解题的关键步骤第一步是？`,opts:["识别题型","套用公式","排除选项","直接计算"],a:0,exp:`任何题型第一步都是识别题型，确定属于${kp}后，再选择对应方法。`},
    {q:`【${kp}】以下哪项是该知识点的易错点？`,opts:["概念混淆导致误选","计算无误","直接套公式","时间充足"],a:0,exp:`${kp}常见易错点在于概念混淆，建议整理笔记对比区分。`},
    {q:`【${kp}】做对该题型需要什么？`,opts:["理解核心概念+反复练习","只看解析","背公式","猜答案"],a:0,exp:`掌握${kp}需要先理解核心概念，再通过5题以上针对性练习巩固。`}
  ];
  return base;
}

function getQuestions(kp){
  return QUESTION_BANK[kp]||genGenericQ(kp);

• 把R化为分数 a/b

• 例：R=25%→1/4→A占4份B占5份X占1份

【假设分配法】

• 步骤：①估X=B×R ②A=B-X ③校验X/A≈R

【比重差公式】
现期比重-基期比重≈(A/B)×(Ra-Rb)/(1+Ra)

【言语语境法】

function huashengReply(input){
  const q=input.toLowerCase();
  let method='',steps='',calc='',trap='';
  if(/abrx|基期|现期|增长量|增长率/.test(q)){
    method='ABRX四量关系';
    steps=`1. 识别已知量（A基期/B现期/R增长率/X增长量）\n2. 确定要求的量\n3. 套用对应公式`;
    calc='B=A×(1+R)，X=A×R，R=X/A，A=B/(1+R)';
    trap='易错：R是小数还是百分数要统一；X≠B-A的逆运算直接用';
  }else if(/截位|直除|除法|速算/.test(q)){
    method='截位直除';
    steps=`1. 判断是一步除还是多步除\n2. 一步除→只截分母3位\n3. 多步除→分子分母都截3位\n4. 直接做除法`;
    calc='截位后保留有效数字，精度足够选答案';
    trap='易错：多步除忘了截分子；截位后小数点位置搞错';
  }else if(/415|份数|分数法/.test(q)){
    method='415份数法';
    steps=`1. 把R化为分数 a/b\n2. A占b份，B占(a+b)份，X占a份\n3. 已知任意一份→求其余`;
    calc='例：R=25%→1/4→A4份B5份X1份';
    trap='易错：分子分母搞反；R不是常见分数时换算有误差';
  }else if(/假设|分配/.test(q)){
    method='假设分配法';
    steps=`1. 估X=B×R\n2. A=B-X\n3. 校验X/A≈R，不匹配微调`;
    calc='X=B×R直接估，A=B-X';
    trap='易错：忘记校验步骤；R偏大时估算误差增大';
  }else if(/比重|比重差/.test(q)){
    method='比重差公式';
    steps=`1. 确定A(部分)、B(整体)\n2. 算Ra(部分增长率)、Rb(整体增长率)\n3. 比重差≈(A/B)×(Ra-Rb)/(1+Ra)`;
    calc='Ra>Rb→比重上升；Ra<Rb→比重下降';
    trap='易错：Ra和Rb搞反；判断升降方向不需要精确计算';
  }else if(/工程|行程|利润|排列|组合|概率|容斥|最值|几何|浓度|数量/.test(q)){

    steps=`1. 先识别题型分类\n2. 工程行程经济利润优先做\n3. 排列组合几何视时间\n4. 难题果断放弃不恋战`;
    calc='数量题性价比=难度分，挑软柿子捏';
    trap='易错：死磕难题浪费时间；简单题计算粗心';
  }else if(/图形|定义|类比|逻辑判断|加强|削弱|翻译|真假/.test(q)){
    method='判断推理规律';
    steps=`1. 图形→位置/样式/属性/数量/空间\n2. 定义→抓核心要件\n3. 类比→语义/逻辑/语法\n4. 逻辑→翻译/真假/分析/加强削弱`;
    calc='判断推理重在找规律，不是硬算';
    trap='易错：定义题漏要件；逻辑题条件理解偏差';
  }else if(/言语|填空|片段|阅读|排序|篇章/.test(q)){
    method='言语语境法';
    steps=`1. 逻辑填空→找语境提示词\n2. 片段阅读→找主旨句\n3. 排序→找首句+捆绑\n4. 篇章→先看问题再看文段`;
    calc='言语题=读懂意思+排除干扰';
    trap='易错：靠语感不找依据；排除选项不够果断';
  }else{
    method='行测通用方法论';
    steps=`1. 识别题型所属板块\n2. 调用对应方法（ABRX/截位/415/假设分配/比重差等）\n3. 速算+排除`;
    calc='行测核心：快+准，不追求完美';
    trap='易错：做题超时；方法选择不当';

}

function renderHome(){
  const s=Store.get('yj_kg_settings',{examDate:defaultExamDate(),encourage:DEFAULT_ENCOURAGE,lastEncourageDate:'',lastEncourageText:''});
  const exam=s.examDate||defaultExamDate();
  const D=Math.ceil((new Date(exam)-new Date())/86400000);
  const reading=Store.get('yj_kg_reading',[]);
  const mock=Store.get('yj_kg_mock',[]);
  const mastery=Store.get('yj_kg_mastery',{});
  const wrongs=Store.get('yj_kg_wrong',[]);

  // 锚点
  const anchors={60:'距考60天｜资料该压到25分钟了',30:'距考30天｜套卷节奏要卡死，言语35内判断30内',15:'距考15天｜申论大作文要动笔写完整3篇',7:'距考7天｜保持手感，别学新东西',3:'距考3天｜只看错题和背过的规范词'};
  let anchorHtml='';
  if(anchors[D])anchorHtml=`<div class="card" style="background:linear-gradient(135deg,var(--yellow1),var(--pink1));border-color:var(--pink2)"><h2>⏰ ${anchors[D]}</h2></div>`;
  if(D<7){
    anchorHtml+=`<div class="card" style="background:#FFE0E0;border-color:#FF8A9A"><h2 style="color:#D04040">🔥 保温模式：复盘为主，不再推新目标</h2><div class="desc">距考不足7天，以下是复盘建议：</div><ol style="padding-left:20px;font-size:13px;line-height:2;color:var(--ink)"><li>每天回顾错题本，重点看高频错因</li><li>模考保持手感，但不追新题</li><li>申论背诵规范表述和大作文框架</li></ol></div>`;
  }

  // 进度总览
  const modules=['资料分析','言语理解','判断推理','数量关系','常识判断','申论'];
  let moduleStats=modules.map(m=>{
    // 从mastery中找该板块的知识点
    const kps=KNOWLEDGE_TREE[m]||[];
    let correct=0,total=0,unlearned=0,weak=0,mastered=0,proficient=0;
    kps.forEach(kp=>{
      const id=`${m}|${kp}`;
      const r=mastery[id];
      if(!r||!r.total){unlearned++;return}
      correct+=r.correct||0;total+=r.total||0;
      const lv=masteryLevel((r.correct/r.total)*100);
      if(lv==='weak')weak++;
      else if(lv==='mastered')mastered++;
      else if(lv==='proficient')proficient++;
    });
    const rate=total>0?Math.round(correct/total*100):0;
    // 模考分数也计入
    const mockScores=mock.filter(e=>e.scores&&e.scores[m]!=null).map(e=>e.scores[m]);
    let mockRate=0;
    if(mockScores.length){
      // 模考分数按比例转正确率（假设满分100）
      mockRate=Math.round(mockScores.reduce((a,b)=>a+b,0)/mockScores.length);
    }
    const finalRate=total>0?Math.round((correct+mockRate*total/100)/(total)*100):mockRate;
    return{m,rate:finalRate||0,unlearned,weak,mastered,proficient,total,kps};
  });

  let progressHtml='<div class="card"><h2><span class="ico">📊</span>进度总览</h2><div class="grid">';
  moduleStats.forEach(ms=>{
    progressHtml+=`<div style="background:#FDFAFF;border:1px solid var(--border);border-radius:14px;padding:14px">
      <div style="font-weight:700;font-size:14px;color:var(--lav-d);margin-bottom:6px">${ms.m}</div>
      <div class="progress-label"><span>正确率 ${ms.rate}%</span><span style="color:var(--pink2)">目标70%</span></div>
      <div class="progress"><div class="bar" style="width:${ms.rate}%"></div><div class="goal" style="left:70%"></div></div>
      <div style="font-size:11px;color:var(--muted);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap">
        <span class="dot unlearned"></span>未学${ms.unlearned}
        <span class="dot weak"></span>薄弱${ms.weak}
        <span class="dot mastered"></span>掌握${ms.mastered}
        <span class="dot proficient"></span>精通${ms.proficient}
      </div></div>`;
  });
  progressHtml+='</div></div>';

  // 阅读日历
  const now=new Date();
  const y=now.getFullYear(),mo=now.getMonth();
  const firstDay=new Date(y,mo,1).getDay();
  const daysInMo=new Date(y,mo+1,0).getDate();
  const dows=['日','一','二','三','四','五','六'];
  let calHtml='<div class="cal">';
  dows.forEach(d=>calHtml+=`<div class="dow">${d}</div>`);
  for(let i=0;i<firstDay;i++)calHtml+='<div class="day other"></div>';
  for(let d=1;d<=daysInMo;d++){
    const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const checked=reading.includes(ds);
    const isToday=ds===today();
    calHtml+=`<div class="day${checked?' checked':''}${isToday?' today':''}" onclick="toggleReading('${ds}')">${d}</div>`;
  }
  calHtml+='</div>';
  // 连续打卡
  let streak=0;
  let checkDate=today();
  while(reading.includes(checkDate)){
    streak++;
    const dd=new Date(checkDate);dd.setDate(dd.getDate()-1);
    checkDate=dd.toISOString().slice(0,10);
  }
  const encourageBtn=reading.includes(today())?
    '<button class="btn btn-gray" disabled>✅ 今日已读</button>':
    '<button class="btn btn-pink" onclick="checkinToday()">📖 今日已读</button>';

  const readingHtml=`<div class="card"><h2><span class="ico">📅</span>阅读打卡</h2>
    <div class="desc">每天坚持阅读，积少成多。点击日期可打卡/取消。</div>
    ${calHtml}
    <div style="text-align:center;margin-top:14px">
      ${encourageBtn}
      ${streak>0?`<span style="margin-left:10px;font-size:13px;color:#C75B7A">🔥 连续${streak}天</span>`:''}
    </div></div>`;

  // 模考记录
  let mockListHtml='';
  if(mock.length===0){
    mockListHtml='<div class="empty"><span class="emoji">📝</span>还没有模考记录，录入第一次成绩吧～</div>';
  }else{
    mock.slice().reverse().forEach(m=>{
      mockListHtml+=`<div class="entry"><div class="head"><span class="tag">第${esc(m.period)}期</span><span class="date">${esc(m.date)}</span>${m.rank?`<span class="tag pink">排名${esc(m.rank)}</span>`:''}</div>
        <div style="font-size:13px;color:var(--ink)">总分：<b style="color:var(--lav-d);font-size:16px">${esc(m.total)}</b>分</div>
        ${m.scores?Object.entries(m.scores).map(([k,v])=>`<span class="tag" style="margin:2px">${esc(k)}:${esc(v)}</span>`).join(''):''}
        <div class="actions"><button class="del" onclick="delMock('${m.id}')">删除</button></div></div>`;
    });
  }
  const mockHtml=`<div class="card"><h2><span class="ico">📝</span>粉笔模考记录</h2>
    <button class="btn btn-sm" onclick="showMockForm()">➕ 录入模考成绩</button>
    <div style="margin-top:14px">${mockListHtml}</div>
    <canvas id="mockChart" style="margin-top:14px;${mock.length<2?'display:none':''}"></canvas></div>`;

  // 复盘入口
  const reviewHtml=`<div class="card"><h2><span class="ico">📈</span>阶段复盘报告</h2>
    <div class="desc">基于真实记录生成，不灌鸡汤。数据不足时会提示需要哪些记录。</div>
    <button class="btn" onclick="genReport('week')">📊 生成周报(近7天)</button>
    <button class="btn btn-out" onclick="genReport('month')">📊 生成月报(近30天)</button>
    <div id="report-area" style="margin-top:14px"></div></div>`;

  $('#content').innerHTML=`
    <div class="page active">
      ${anchorHtml}
      ${progressHtml}
      ${readingHtml}
      ${mockHtml}
      ${reviewHtml}
    </div>`;
  // 模考图表
  if(mock.length>=2){
    setTimeout(()=>{
      const ctx=$('#mockChart');
      if(ctx&&window.Chart){
        new Chart(ctx.getContext('2d'),{
          type:'line',
          data:{labels:mock.map(m=>m.date),datasets:[{label:'总分',data:mock.map(m=>m.total),borderColor:'#C9A7EB',backgroundColor:'rgba(201,167,235,.1)',tension:.3,fill:true}]},
          options:{responsive:true,plugins:{legend:{labels:{color:'#4A3B52'}}},scales:{x:{ticks:{color:'#9B8CAB'}},y:{ticks:{color:'#9B8CAB'}}}}
        });
      }
    },100);
  }
}

function toggleReading(ds){
  let r=Store.get('yj_kg_reading',[]);
  if(r.includes(ds)){
    r=r.filter(d=>d!==ds);
  }else{
    r.push(ds);
  }
  Store.set('yj_kg_reading',r);
  renderHome();
}

function checkinToday(){
  const r=Store.get('yj_kg_reading',[]);
  const t=today();
  if(r.includes(t)){toast('今天已经打过卡啦！');return}
  r.push(t);
  Store.set('yj_kg_reading',r);
  // 鼓励语
  const s=Store.get('yj_kg_settings',{encourage:DEFAULT_ENCOURAGE});
  const pool=s.encourage&&s.encourage.length?s.encourage:DEFAULT_ENCOURAGE;
  let msg='';
  if(s.lastEncourageDate===t&&s.lastEncourageText){
    msg=s.lastEncourageText;
  }else{
    // 取未用过的
    const used=Store.get('yj_kg_used_encourage',[]);
    const avail=pool.filter(p=>!used.includes(p));
    msg=avail.length?avail[Math.floor(Math.random()*avail.length)]:pool[Math.floor(Math.random()*pool.length)];
    used.push(msg);
    if(used.length>pool.length*2)used=[];
    Store.set('yj_kg_used_encourage',used);
    s.lastEncourageDate=t;s.lastEncourageText=msg;
    Store.set('yj_kg_settings',s);
  }
  toast(msg+' 🌸',true);
  renderHome();
}

function genReport(type){
  const days=type==='week'?7:30;
  const label=type==='week'?'周报':'月报';
  const now=new Date();
  const cutoff=new Date(now.getTime()-days*86400000);
  const reading=Store.get('yj_kg_reading',[]);
  const mock=Store.get('yj_kg_mock',[]);
  const mastery=Store.get('yj_kg_mastery',{});
  const wrongs=Store.get('yj_kg_wrong',[]);
  const recentReading=reading.filter(d=>new Date(d)>=cutoff);
  const recentMock=mock.filter(m=>new Date(m.date)>=cutoff);
  const recentWrong=wrongs.filter(w=>new Date(w.date)>=cutoff);

  // 各板块正确率变化
  const modules=['资料分析','言语理解','判断推理','数量关系','常识判断','申论'];
  let moduleDelta=modules.map(m=>{
    const kps=KNOWLEDGE_TREE[m]||[];
    let correct=0,total=0;
    kps.forEach(kp=>{
      const r=mastery[`${m}|${kp}`];
      if(r&&r.total){correct+=r.correct||0;total+=r.total||0}
    });
    const rate=total>0?Math.round(correct/total*100):0;
    // 历史正确率
    let oldCorrect=0,oldTotal=0;
    kps.forEach(kp=>{
      const r=mastery[`${m}|${kp}`];
      if(r&&r.history){
        r.history.forEach(h=>{
          if(new Date(h.date)<cutoff){oldCorrect+=h.correct||0;oldTotal+=h.total||0}
        });
      }
    });
    const oldRate=oldTotal>0?Math.round(oldCorrect/oldTotal*100):rate;
    return{m,rate,oldRate,delta:rate-oldRate};
  });

  // 掌握度迁移
  let migrated=0;
  modules.forEach(m=>{
    (KNOWLEDGE_TREE[m]||[]).forEach(kp=>{
      const r=mastery[`${m}|${kp}`];
      if(r&&r.total){
        const lv=masteryLevel((r.correct/r.total)*100);
        if(lv!=='unlearned')migrated++;
      }
    });
  });

  // 错因Top3
  const causeCount={concept:0,logic:0,careless:0};
  recentWrong.forEach(w=>{
    (w.causes||[]).forEach(c=>{if(causeCount[c]!==undefined)causeCount[c]++});
  });
  const causeLabels={concept:'概念没懂',logic:'思路错了',careless:'纯粗心'};
  const topCauses=Object.entries(causeCount).sort((a,b)=>b[1]-a[1]).filter(c=>c[1]>0).slice(0,3);

  // 最该攻的弱点
  let weakest={m:'',rate:999};
  moduleDelta.forEach(md=>{
    if(md.rate<weakest.rate&&md.total!==undefined)weakest=md;
  });
  // 找该板块薄弱知识点
  let weakestKp='';
  if(weakest.m){
    const kps=KNOWLEDGE_TREE[weakest.m]||[];
    for(const kp of kps){
      const r=mastery[`${weakest.m}|${kp}`];
      if(r&&r.total){
        const rate=(r.correct/r.total)*100;
        if(rate<60){weakestKp=kp;break}
      }
    }
  }

  // 小结句子
  let summary='';
  const up=moduleDelta.filter(d=>d.delta>0);
  const down=moduleDelta.filter(d=>d.delta<0);
  if(recentReading.length===0&&recentMock.length===0&&recentWrong.length===0&&migrated===0){
    summary=`近${days}天暂无新的学习记录，建议尽快开始刷题或录入模考成绩，数据会自动计入进度。`;
  }else if(up.length&&down.length){
    summary=`近${days}天${up.map(d=>d.m+'+'+d.delta+'%').join('、')}提升，但${down.map(d=>d.m+d.delta+'%').join('、')}下降，${weakest.m}的${weakestKp||'薄弱知识点'}需要集中突破。`;
  }else if(up.length){
    summary=`近${days}天${up.map(d=>d.m+'+'+d.delta+'%').join('、')}均有提升，保持节奏，${weakest.m?weakest.m+'仍是最弱板块需持续巩固':'各板块均衡发展'}。`;
  }else if(down.length){
    summary=`近${days}天${down.map(d=>d.m+d.delta+'%').join('、')}下降，建议回顾错题本找出原因，重点放在${weakest.m||'薄弱板块'}。`;
  }else{
    summary=`近${days}天各板块正确率稳定，打卡${recentReading.length}天，模考${recentMock.length}次，错题${recentWrong.length}条，继续按计划推进。`;
  }

  const html=`<div style="background:#FDFAFF;border:1px solid var(--border);border-radius:14px;padding:16px;font-size:13px;line-height:1.8">
    <h3 style="color:var(--lav-d);margin-bottom:10px">📊 ${label}（近${days}天）</h3>
    <p><b>📅 打卡命中天数：</b>${recentReading.length} 天</p>
    <p><b>📝 模考次数：</b>${recentMock.length} 次${recentMock.length?'，平均分'+Math.round(recentMock.reduce((a,b)=>a+(b.total||0),0)/recentMock.length):''}</p>
    <p><b>📒 新增错题：</b>${recentWrong.length} 条</p>
    <p><b>📈 各板块正确率变化：</b></p>
    <ul style="padding-left:20px;margin:4px 0">
    ${moduleDelta.map(d=>`<li>${d.m}：${d.rate}% ${d.delta>=0?'(+'+d.delta+'%)':'('+d.delta+'%)'}</li>`).join('')}
    </ul>
    <p><b>🔄 掌握度迁移：</b>从未学→有记录的考点 ${migrated} 个</p>
    <p><b>🔴 错因Top3：</b>${topCauses.length?topCauses.map(c=>causeLabels[c[0]]+'('+c[1]+'次)').join('、'):'暂无错题记录'}</p>
    <p><b>🎯 最该攻的弱点：</b>${weakest.m?weakest.m+(weakestKp?'·'+weakestKp:''):'暂无明显弱点'}</p>
    <hr style="border:none;border-top:1px dashed var(--border);margin:10px 0">
    <p style="font-weight:600;color:var(--lav-d)">💡 ${esc(summary)}</p>
  </div>`;
  $('#report-area').innerHTML=html;
  toast(`${label}已生成 ✓`);
}

function startQuiz(mod,kp){
  const qs=getQuestions(kp);
  let answers=[];
  let idx=0;
  // 申论类不机械判分
  const isShenlun=mod==='申论';
  function showQ(){
    if(idx>=qs.length){
      // 结算
      if(isShenlun){
        showModal(`<h3>📝 ${esc(kp)} · 练习完成</h3>
          <p style="font-size:13px;color:var(--ink);line-height:1.8">申论类题目不机械判分。请对照参考框架检查：</p>
          <ul style="padding-left:20px;font-size:13px;line-height:2;color:var(--ink)">
            <li>要素是否齐全（问题/原因/影响/对策）</li>
            <li>结构是否清晰（总分总/并列/递进）</li>
            <li>语言是否规范（去口语化）</li>
          </ul>
          <p style="font-size:12px;color:var(--muted);margin-top:10px">建议手动记录本次练习心得到「灵感积累」板块。</p>
          <div class="btns"><button class="btn" onclick="closeModal()">完成</button></div>`);
      }else{
        const correct=answers.filter(a=>a).length;
        const rate=Math.round(correct/qs.length*100);
        const lv=masteryLevel(rate);
        // 回写掌握度
        const m=Store.get('yj_kg_mastery',{});
        const id=`${mod}|${kp}`;
        if(!m[id])m[id]={correct:0,total:0,history:[]};
        m[id].correct+=correct;
        m[id].total+=qs.length;
        if(!m[id].history)m[id].history=[];
        m[id].history.push({date:today(),correct,total:qs.length,rate});
        Store.set('yj_kg_mastery',m);
        showModal(`<h3>🎉 ${esc(kp)} · 练习完成</h3>
          <div style="text-align:center;padding:10px">
            <div style="font-size:36px;font-weight:700;color:${MASTERY_COLOR[lv]}">${rate}%</div>
            <div style="font-size:14px;color:var(--muted)">答对 ${correct}/${qs.length} 题</div>
            <div class="mastery-tag ${lv}" style="margin-top:8px;font-size:14px;padding:4px 14px">掌握度：${MASTERY_LABEL[lv]}</div>
          </div>
          <div class="btns"><button class="btn" onclick="closeModal();switchPage('map')">完成</button></div>`);
        // 更新首页badge
        updateBadges();
      }
      return;
    }
    const q=qs[idx];
    let optsHtml='';
    q.opts.forEach((o,i)=>{
      optsHtml+=`<label style="display:flex;align-items:center;gap:8px;padding:8px 12px;border:1.5px solid var(--border);border-radius:10px;cursor:pointer;margin:4px 0;transition:.2s" onmouseover="this.style.borderColor='var(--lav)'" onmouseout="this.style.borderColor='var(--border)'">
        <input type="radio" name="q" value="${i}" style="width:auto"> <span>${esc(o)}</span></label>`;
    });
    showModal(`<h3>📝 ${esc(kp)}（${idx+1}/${qs.length}）</h3>
      <p style="font-size:14px;color:var(--ink);line-height:1.7;margin-bottom:12px">${esc(q.q)}</p>
      ${isShenlun?'<textarea id="q-answer" placeholder="请输入你的答题要点..." style="min-height:100px"></textarea>':optsHtml}
      <div class="btns"><button class="btn btn-gray" onclick="closeModal()">放弃</button><button class="btn" onclick="submitAnswer(${idx})">${idx<qs.length-1?'下一题':'完成'}</button></div>`);
  }
  window.submitAnswer=function(i){
    if(isShenlun){
      answers.push(false); // 申论不判分
      idx++;
      showQ();
    }else{
      const sel=document.querySelector('input[name=q]:checked');
      if(!sel){toast('请选择一个答案');return}
      const ans=parseInt(sel.value);
      // 由于闭包问题，用 qs[idx]
      const curQ=qs[i];
      answers.push(curQ.a===ans);
      idx++;
      if(ans===curQ.a){
        toast('✅ 正确！');
      }else{
        showModal(`<h3>❌ 答错了</h3>
          <p style="font-size:14px">${esc(curQ.q)}</p>
          <p style="font-size:13px;color:var(--ink);margin:8px 0">正确答案：<b style="color:var(--lav-d)">${esc(curQ.opts[curQ.a])}</b></p>
          <div style="background:var(--yellow1);border-radius:10px;padding:10px;font-size:12px;color:var(--ink);line-height:1.7">💡 ${esc(curQ.exp)}</div>
          <div class="btns"><button class="btn" onclick="idx=${idx};showQ()">继续</button></div>`);
        return;
      }
      showQ();
    }
  };
  showQ();
}

function renderGuide(){

  window._curTeacher=currentTeacher;
  const kb=currentTeacher==='huasheng'?HUASHENG_KB:ZHANGGONG_KB;
  const teacherName=currentTeacher==='huasheng'?'花生十三':'张弓';
  const teacherEmoji=currentTeacher==='huasheng'?'🥜':'🎯';
  const todayChat=chat[currentTeacher]?.[today()]||[];
  let msgHtml='';
  if(todayChat.length===0){
    msgHtml='<div class="empty"><span class="emoji">💬</span>还没有对话，开始向'+teacherName+'老师提问吧～</div>';

    todayChat.forEach(m=>{
      msgHtml+=`<div class="msg ${m.role==='user'?'user':'teacher'}"><div class="bubble">${esc(m.content)}</div></div>`;

function switchTeacher(t){
  window._curTeacher=t;
  renderGuide();
}

function sendChat(){
  const input=$('#chat-input');
  const text=input.value.trim();
  if(!text)return;
  const t=window._curTeacher||'huasheng';
  const chat=Store.get('yj_kg_chat',{huasheng:{},zhanggong:{}});
  if(!chat[t])chat[t]={};
  if(!chat[t][today()])chat[t][today()]=[];
  chat[t][today()].push({role:'user',content:text,ts:Date.now()});
  // 回复
  const reply=t==='huasheng'?huashengReply(text):zhanggongReply(text);
  chat[t][today()].push({role:'teacher',content:reply,ts:Date.now()+1});
  Store.set('yj_kg_chat',chat);
  input.value='';
  renderGuide();
  // 言语题提醒
  if(/填空|片段|言语|阅读|排序|篇章|主旨|概括|意图/.test(text.toLowerCase())){
    if(t!=='zhanggong')toast('💡 言语题推荐切换到张弓老师哦😊');
  }else if(/资料|判断|数量|图形|定义|类比|逻辑|工程|行程|利润|排列|组合|概率|容斥/.test(text.toLowerCase())){
    if(t!=='huasheng')toast('💡 行测题推荐切换到花生十三老师哦🥜');
  }
}

function loadChatHistory(d){
  const t=window._curTeacher||'huasheng';
  const chat=Store.get('yj_kg_chat',{huasheng:{},zhanggong:{}});
  const msgs=chat[t]?.[d]||[];
  let html='';
  msgs.forEach(m=>{
    html+=`<div class="msg ${m.role==='user'?'user':'teacher'}"><div class="bubble">${esc(m.content)}</div><div style="font-size:10px;color:var(--muted);margin-top:2px">${esc(d)}</div></div>`;
  });
  $('#chat-box').innerHTML=html||'<div class="empty">当天无对话</div>';
}

function renderWrong(){
  const wrongs=Store.get('yj_kg_wrong',[]);
  const mastery=Store.get('yj_kg_mastery',{});
  const s=Store.get('yj_kg_settings',{examDate:defaultExamDate()});

  // 今日待复习
  const exam=new Date(s.examDate||defaultExamDate());
  const now=new Date();
  const preExam=new Date(exam.getTime()-7*86400000);
  let toReview=[];
  wrongs.forEach(w=>{
    const d=new Date(w.date);
    const day3=new Date(d.getTime()+3*86400000);
    const day10=new Date(d.getTime()+10*86400000);
    const todayStr=today();
    if(w.date===todayStr||day3.toISOString().slice(0,10)===todayStr||day10.toISOString().slice(0,10)===todayStr||(now>=preExam&&now<=exam)){
      if(!(w.reviewed||[]).includes(todayStr))toReview.push(w);
    }
  });
  // badge
  $('#wrong-badge').textContent=toReview.length;
  $('#wrong-badge').style.display=toReview.length?'inline-block':'none';

  // 统计
  const causeCount={concept:0,logic:0,careless:0};
  wrongs.forEach(w=>(w.causes||[]).forEach(c=>{if(causeCount[c]!==undefined)causeCount[c]++}));
  const modules=Object.keys(KNOWLEDGE_TREE);
  const modCount={};
  wrongs.forEach(w=>{
    const m=w.module||'未分类';
    modCount[m]=(modCount[m]||0)+1;
  });

  let html='<div class="page active">';
  // 待复习
  html+=`<div class="card"><h2><span class="ico">🔔</span>今日待复习 ${toReview.length>0?'<span class="badge" style="background:#FF8A9A;color:#fff">'+toReview.length+'</span>':''}</h2>`;
  if(toReview.length===0){
    html+='<div class="empty"><span class="emoji">✅</span>今天没有待复习的错题，继续保持～</div>';
  }else{
    toReview.forEach(w=>{
      html+=`<div class="entry"><div class="head"><span class="tag">${esc(w.module)}</span><span class="tag pink">${esc(w.kp)}</span><span class="date">${esc(w.date)}</span></div>
        <div class="body">${esc(w.summary||'')}</div>
        <div class="actions"><button class="btn btn-sm" onclick="markReviewed('${w.id}')">✅ 已复习</button>
        <button class="btn btn-sm btn-out" onclick="viewWrong('${w.id}')">查看详情</button></div></div>`;
    });
  }
  html+='</div>';

  // 统计
  html+='<div class="card"><h2><span class="ico">📊</span>错题统计</h2><div class="grid-2">';
  Object.entries(modCount).forEach(([m,c])=>{
    html+=`<div class="stat"><div class="num">${c}</div><div class="lbl">${esc(m)}</div></div>`;
  });
  html+='</div>';
  html+='<canvas id="causeChart" style="max-height:200px;margin-top:10px"></canvas></div>';

  // 录入
  html+=`<div class="card"><h2><span class="ico">➕</span>添加错题</h2>
    <div class="desc">两入口：手动录入 / 图片占位（提示确认板块知识点）</div>
    <button class="btn" onclick="showWrongForm('manual')">📝 手动录入</button>
    <button class="btn btn-out" onclick="showWrongForm('image')">🖼️ 图片占位</button>
    </div>`;

  // 搜索
  html+=`<div class="card"><h2><span class="ico">🔍</span>错题列表</h2>
    <div class="toolbar">
      <input type="text" id="w-search" placeholder="搜索题干/知识点..." oninput="filterWrong()">
      <select id="w-mod" onchange="filterWrong()"><option value="">全部板块</option>${modules.map(m=>`<option>${esc(m)}</option>`).join('')}</select>
      <select id="w-cause" onchange="filterWrong()"><option value="">全部错因</option><option value="concept">概念没懂</option><option value="logic">思路错了</option><option value="careless">纯粗心</option></select>
    </div>
    <div id="wrong-list"></div></div>`;
  html+='</div>';
  $('#content').innerHTML=html;
  renderWrongList();
  // 错因饼图
  setTimeout(()=>{
    const ctx=$('#causeChart');
    if(ctx&&window.Chart&&(causeCount.concept||causeCount.logic||causeCount.careless)){
      new Chart(ctx.getContext('2d'),{
        type:'pie',
        data:{labels:['概念没懂','思路错了','纯粗心'],datasets:[{data:[causeCount.concept,causeCount.logic,causeCount.careless],backgroundColor:['#FF8A9A','#8AC6E8','#D5CEDD']}]},
        options:{responsive:true,plugins:{legend:{position:'bottom',labels:{color:'#4A3B52',font:{size:11}}}}}
      });
    }
  },100);
}

function renderWrongList(filter){
  const wrongs=Store.get('yj_kg_wrong',[]);
  const q=$('#w-search')?.value?.trim()||'';
  const mod=$('#w-mod')?.value||'';
  const cause=$('#w-cause')?.value||'';
  let list=wrongs.filter(w=>{
    if(mod&&w.module!==mod)return false;
    if(cause&&!(w.causes||[]).includes(cause))return false;
    if(q){
      const text=(w.summary||'')+(w.kp||'')+(w.module||'')+(w.analysis||'');
      if(!text.toLowerCase().includes(q.toLowerCase()))return false;
    }
    return true;
  }).reverse();
  const el=$('#wrong-list');
  if(!el)return;
  if(list.length===0){
    el.innerHTML='<div class="empty"><span class="emoji">📒</span>还没有错题，添加第一条吧～</div>';
    return;
  }
  el.innerHTML=list.map(w=>`
    <div class="entry ${w.star?'highlight':''}">
      <div class="head"><span class="tag">${esc(w.module)}</span><span class="tag pink">${esc(w.kp)}</span><span class="date">${esc(w.date)}</span>
      ${(w.causes||[]).map(c=>{const labels={concept:'🔴概念没懂',logic:'🔵思路错了',careless:'⚪纯粗心'};return `<span class="tag ${c==='concept'?'red':c==='logic'?'blue':''}">${labels[c]}</span>`}).join('')}</div>
      <div class="body">${esc((w.summary||'').slice(0,100))}${(w.summary||'').length>100?'...':''}</div>
      <div class="actions">
        <button class="star" onclick="toggleStar('${w.id}','wrong')">${w.star?'⭐':'☆'}</button>
        <button class="fav ${w.fav?'on':''}" onclick="toggleFav('${w.id}','wrong')">${w.fav?'📌':'📍'}</button>
        <button class="red-mark ${w.red?'on':''}" onclick="toggleRed('${w.id}','wrong')">🔴</button>
        <button class="edit" onclick="viewWrong('${w.id}')">详情</button>
        <button class="del" onclick="delWrong('${w.id}')">删除</button>
      </div></div>`).join('');
}

function updateKpOpts(){

  $('#w-kp').innerHTML='<option value="">请选择</option>'+kps.map(k=>`<option>${esc(k)}</option>`).join('');

function saveWrong(){
  const mod=$('#w-module').value;
  const kp=$('#w-kp').value;
  if(!mod||!kp){toast('请选择板块和知识点');return}
  const causes=[];
  if($('.错因-btn.concept').classList.contains('on'))causes.push('concept');
  if($('.错因-btn.logic').classList.contains('on'))causes.push('logic');
  if($('.错因-btn.careless').classList.contains('on'))causes.push('careless');
  if(causes.length===0){toast('请至少选一个错因');return}
  const wrongs=Store.get('yj_kg_wrong',[]);
  const w={
    id:uid(),module:mod,kp:kp,
    summary:$('#w-summary').value.trim(),
    type:$('#w-type').value.trim(),
    flag:$('#w-flag').value.trim(),
    think:$('#w-think').value.trim(),
    calc:$('#w-calc').value.trim(),
    ans:$('#w-ans').value.trim(),
    trap:$('#w-trap').value.trim(),
    causes,date:today(),reviewed:[],star:false,fav:false,red:false
  };
  wrongs.push(w);
  Store.set('yj_kg_wrong',wrongs);
  closeModal();
  toast('错题已保存 ✓');
  renderWrong();
}

function delWrong(id){
  if(!confirm('删除这道错题？'))return;
  Store.set('yj_kg_wrong',Store.get('yj_kg_wrong',[]).filter(w=>w.id!==id));
  renderWrong();
}

function markReviewed(id){
  const wrongs=Store.get('yj_kg_wrong',[]);
  const w=wrongs.find(x=>x.id===id);
  if(w){
    if(!w.reviewed)w.reviewed=[];
    w.reviewed.push(today());
    Store.set('yj_kg_wrong',wrongs);
    toast('已标记复习 ✓');
    renderWrong();
  }
}

function analyzeEssay(){
  const text=$('#e-text').value.trim();
  if(!text){toast('请粘贴文段');return}
  // 简单关键词匹配拆解
  const patterns={
    problem:/(问题|不足|缺乏|短缺|滞后|矛盾|困难|痛点|困境)/g,
    cause:/(原因|由于|因为|根源|导致|造成|使得)/g,
    influence:/(影响|作用|意义|有利于|不利于|促进|阻碍|推动)/g,
    manifestation:/(表现为|体现在|现状|状况|目前|当前)/g,
    countermeasure:/(对策|措施|建议|应该|需要|加强|完善|推进|落实|鼓励|支持)/g
  };
  const labels={problem:'问题',cause:'原因',influence:'影响',manifestation:'表现',countermeasure:'对策'};
  const colors={problem:'pink',cause:'red',influence:'blue',manifestation:'green',countermeasure:'yellow'};
  // 按句拆
  const sentences=text.split(/[。；！？\n]/).filter(s=>s.trim());
  let result='';
  sentences.forEach(s=>{
    let matched=false;
    for(const[key,pat]of Object.entries(patterns)){
      if(pat.test(s)){
        result+=`<div style="background:var(--${colors[key]==='red'?'pink1':colors[key]==='blue'?'sky1':colors[key]==='green'?'mint1':colors[key]==='yellow'?'yellow1':'pink1'});padding:6px 10px;border-radius:8px;margin:4px 0;font-size:13px"><span class="tag ${colors[key]}">${labels[key]}</span> ${esc(s)}</div>`;
        matched=true;break;
      }
    }
    if(!matched)result+=`<div style="padding:6px 10px;font-size:13px;color:var(--muted)">${esc(s)}</div>`;
  });
  $('#essay-result').innerHTML=`<h3>拆解结果</h3>${result}<p style="font-size:12px;color:var(--muted);margin-top:8px">💡 可手动选中文字改标签（当前为自动标注）</p>`;
  // 保存
  const essays=Store.get('yj_kg_essay',[]);
  essays.push({id:uid(),text,date:today(),star:false,fav:false,red:false});
  Store.set('yj_kg_essay',essays);
  renderEssayList();
}

function renderEssayList(){
  const essays=Store.get('yj_kg_essay',[]);
  const el=$('#essay-list');
  if(!el)return;
  if(essays.length===0){el.innerHTML='<div class="empty"><span class="emoji">📝</span>还没有申论分析记录～</div>';return}
  el.innerHTML=essays.slice().reverse().map(e=>`
    <div class="entry ${e.star?'highlight':''}">
      <div class="head"><span class="date">${esc(e.date)}</span></div>
      <div class="body">${esc((e.text||'').slice(0,150))}${(e.text||'').length>150?'...':''}</div>
      <div class="actions">
        <button class="star" onclick="toggleStar('${e.id}','essay')">${e.star?'⭐':'☆'}</button>
        <button class="fav ${e.fav?'on':''}" onclick="toggleFav('${e.id}','essay')">${e.fav?'📌':'📍'}</button>
        <button class="del" onclick="delEssay('${e.id}')">删除</button>
      </div></div>`).join('');
}

}

function addPolitics(){
  const date=$('#p-date').value||today();
  const text=$('#p-text').value.trim();
  if(!text){toast('请粘贴新闻内容');return}
  const lines=text.split('\n').filter(s=>s.trim());
  if(lines.length<3){toast('建议粘贴≥3条新闻以生成完整卡片');return}
  const essays=Store.get('yj_kg_politics',[]);
  const cards=lines.slice(0,10).map(l=>{
    const angles=['背景','论证','对策'];
    const angle=angles[Math.floor(Math.random()*3)];
    return{event:l.trim().slice(0,60),angle,format:`规范表述：${l.trim().slice(0,40)}...（可套用于申论${angle}段）`};
  });
  essays.push({id:uid(),date,cards,star:false,fav:false,red:false});
  Store.set('yj_kg_politics',essays);
  $('#p-text').value='';
  toast('时政卡片已生成 ✓');
  renderPoliticsList();
}

function renderPoliticsList(){
  const list=Store.get('yj_kg_politics',[]);
  const el=$('#politics-list');
  if(!el)return;
  if(list.length===0){el.innerHTML='<div class="empty"><span class="emoji">📰</span>还没有时政卡片～</div>';return}
  const now=new Date();
  const monthAgo=new Date(now.getTime()-30*86400000);
  el.innerHTML=list.slice().reverse().map(p=>{
    const isNew=new Date(p.date)>=monthAgo;
    return`<div class="entry ${p.star?'highlight':''}">
      <div class="head"><span class="date">${esc(p.date)}</span>${isNew?'<span class="new-tag">🆕</span>':''}</div>
      ${(p.cards||[]).map(c=>`<div class="pol-card"><div style="font-weight:600;color:var(--lav-d)">${esc(c.event)}</div><span class="tag">${esc(c.angle)}</span><div style="font-size:12px;color:var(--muted);margin-top:4px">${esc(c.format)}</div></div>`).join('')}
      <div class="actions">
        <button class="star" onclick="toggleStar('${p.id}','politics')">${p.star?'⭐':'☆'}</button>
        <button class="fav ${p.fav?'on':''}" onclick="toggleFav('${p.id}','politics')">${p.fav?'📌':'📍'}</button>
        <button class="del" onclick="delPolitics('${p.id}')">删除</button>
      </div></div>`;
  }).join('');
}

function delPolitics(id){
  Store.set('yj_kg_politics',Store.get('yj_kg_politics',[]).filter(p=>p.id!==id));
  renderPoliticsList();
}

/* ---------- 通用操作 ---------- */
function toggleStar(id,type){
  const key={wrong:'yj_kg_wrong',vocab:'yj_kg_vocab',essay:'yj_kg_essay',politics:'yj_kg_politics'}[type];
  const list=Store.get(key,[]);
  const item=list.find(x=>x.id===id);
  if(item){item.star=!item.star;Store.set(key,list)}
  refreshCurrentList(type);
}
function toggleFav(id,type){
  const key={wrong:'yj_kg_wrong',vocab:'yj_kg_vocab',essay:'yj_kg_essay',politics:'yj_kg_politics'}[type];
  const list=Store.get(key,[]);
  const item=list.find(x=>x.id===id);
  if(item){item.fav=!item.fav;Store.set(key,list)}
  refreshCurrentList(type);
}
function toggleRed(id,type){
  const key={wrong:'yj_kg_wrong',vocab:'yj_kg_vocab',essay:'yj_kg_essay',politics:'yj_kg_politics'}[type];
  const list=Store.get(key,[]);
  const item=list.find(x=>x.id===id);
  if(item){item.red=!item.red;Store.set(key,list)}
  refreshCurrentList(type);
}
function refreshCurrentList(type){
  if(currentPage==='wrong')renderWrongList();
  if(currentPage==='inspire'){
    const t=window._inspireTab;
    if(t==='vocab')renderVocabList();
    if(t==='essay')renderEssayList();
    if(t==='politics')renderPoliticsList();
  }
}

function saveSettings(){
  const s=Store.get('yj_kg_settings',{});
  s.examDate=$('#set-exam').value;
  Store.set('yj_kg_settings',s);
  const theme=$('#set-theme').value;
  Store.set('yj_kg_theme',theme);
  applyTheme(theme);
  toast('设置已保存 ✓');
  updateTopbar();
}
function applyTheme(theme){
  document.documentElement.removeAttribute('data-theme');
  if(theme&&theme!=='default')document.documentElement.setAttribute('data-theme',theme);
}
function saveEncourage(){
  const lines=$('#set-encourage').value.split('\n').filter(s=>s.trim());
  if(lines.length<5){toast('鼓励语太少，至少5句吧～');return}
  const s=Store.get('yj_kg_settings',{});
  s.encourage=lines;
  Store.set('yj_kg_settings',s);
  toast('鼓励语已保存 ✓');
}
function resetEncourage(){
  $('#set-encourage').value=DEFAULT_ENCOURAGE.join('\n');
  toast('已恢复默认鼓励语');
}
function exportData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('yj_kg_')){
      try{data[k]=JSON.parse(localStorage.getItem(k))}catch(e){data[k]=localStorage.getItem(k)}
    }
  }
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='煜婕考公台备份_'+today()+'.json';
  a.click();
  toast('备份已导出 ✓');
}
$('#file-input').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      let count=0;
      for(const[k,v]of Object.entries(data)){
        if(k.startsWith('yj_kg_')){
          localStorage.setItem(k,JSON.stringify(v));
          count++;
        }
      }
      toast('导入成功，共'+count+'项 ✓');
      switchPage(currentPage);
      updateTopbar();
    }catch(err){toast('文件格式有误')}
  };
  r.readAsText(f);
};
function clearData(){
  if(!confirm('确认清空全部数据？此操作不可恢复！'))return;
  if(!confirm('再次确认：真的要删除所有学习记录吗？'))return;
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.startsWith('yj_kg_'))keys.push(k);
  }
  keys.forEach(k=>localStorage.removeItem(k));
  toast('数据已清空');
  switchPage('settings');
  updateTopbar();
}

let deferredPrompt;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;

/* ---------- Badge更新 ---------- */
function updateBadges(){
  const wrongs=Store.get('yj_kg_wrong',[]);
  const s=Store.get('yj_kg_settings',{examDate:defaultExamDate()});
  const exam=new Date(s.examDate||defaultExamDate());
  const now=new Date();
  const preExam=new Date(exam.getTime()-7*86400000);
  let count=0;
  wrongs.forEach(w=>{
    const d=new Date(w.date);
    const day3=new Date(d.getTime()+3*86400000);
    const day10=new Date(d.getTime()+10*86400000);
    const ts=today();
    if(w.date===ts||day3.toISOString().slice(0,10)===ts||day10.toISOString().slice(0,10)===ts||(now>=preExam&&now<=exam)){
      if(!(w.reviewed||[]).includes(ts))count++;
    }
  });
  $('#wrong-badge').textContent=count;
  $('#wrong-badge').style.display=count?'inline-block':'none';
}

  const swCode=`const CACHE_NAME='yj-kg-studio-v2';const ASSETS=['./'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(ASSETS)).then(()=>self.skipWaiting()))});

self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const url=new URL(e.request.url);if(url.origin===self.location.origin){e.respondWith(caches.match(e.request).then(h=>h||fetch(e.request).then(res=>{const copy=res.clone();caches.open(CACHE_NAME).then(c=>c.put(e.request,copy)).catch(()=>{});return res}).catch(()=>caches.match('./index.html')))})}});`;
  try{
